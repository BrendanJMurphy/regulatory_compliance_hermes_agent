[project]
name = "compliance-mcp"
version = "0.1.0"
description = "MCP server exposing governed compliance systems (policies, controls, regulatory feed, tickets, drafts) to a Hermes agent, with an append-only hash-chained audit log."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
compliance-mcp = "compliance_mcp.server:main"
compliance-review = "compliance_mcp.review_cli:main"
compliance-audit = "compliance_mcp.audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
